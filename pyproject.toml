[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prd-generator"
version = "0.1.0"
description = "Turn a one-line product idea into a structured PRD with user stories, acceptance criteria, EARS specs, and risks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nic Hansen" }]
keywords = ["product-management", "prd", "claude", "ears", "agents", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "anthropic>=0.40.0",
  "click>=8.1.7",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/nich9000/prd-generator"
Issues = "https://github.com/nich9000/prd-generator/issues"

[project.scripts]
prd = "prd_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
